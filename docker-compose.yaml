services:
  postgres:
    container_name: postgres_go
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_USER: ${PGSQL_USER}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - ./postgres-data:/data/postgres
    ports:
      - "${DB_PORT}:${PGSQL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  uss-service:
    container_name: uss-service
    build:
      context: ./
      dockerfile: ./uss-service.dockerfile
    restart: always
    environment:
      APP_HOST: "${APP_HOST}"
      APP_PORT: "${APP_PORT}"
      DATABASE_URL: "postgresql://${PGSQL_USER}:${PGSQL_PASSWORD}@${PGSQL_HOST}:${PGSQL_PORT}/${PGSQL_DBNAME}?sslmode=${DB_SSLMODE}"
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
